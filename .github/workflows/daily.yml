name: Buddy 加油站每日自动化

on:
  schedule:
    # 策略（2026-11-04 调整）：云端版只作为**晚间兜底**，每天一次。
    # 正常情况由本机 WorkBuddy 自动化在每天 09:00 完成签到与派猫猫；
    # 只有本机没跑成（电脑没开机等）时，云端这趟在晚上补上。
    # 脚本是幂等的：已签过只会返回「今日已签过」，名额用完不会重派，
    # 所以多触发不会重复领取。
    #
    # 接口地址必须是 https://www.workbuddy.cn；
    # 旧值 https://copilot.tencent.com 已失效（404），会导致每天三次失败推送。
    #
    # 注意 cron 按 UTC 计时，下面是 UTC，括号内为北京时间（UTC+8）。
    - cron: "10 12 * * *"   # 12:10 UTC = 20:10 北京（晚间兜底，每天仅此一次）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 定位 Python 解释器
        id: py
        # 解释器路径不写死版本号，动态取 runner 上可用的解释器
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "未找到可用的 Python 解释器" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print("使用解释器:", sys.executable, sys.version.split()[0])'
          echo "python_path=$PY" >> "$GITHUB_OUTPUT"

      - name: 执行签到与派猫猫
        id: run
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WB_ENDPOINT: https://www.workbuddy.cn
          WB_RESULT_FILE: ${{ runner.temp }}/wb_result.json
        run: |
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          set +e
          "$PY" wb_auto.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 签到成功即成功：脚本自身已把猫猫失败与签到结论解耦，
          # 这里统一以 0 退出，仅用 warning 提示存在未完成项。
          if [ "$code" -ne 0 ]; then
            echo "::warning::本轮存在未完成项，详见上方日志与飞书卡片"
          fi
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/wb_result.json
        run: |
          set -uo pipefail
          {
            echo "### Buddy 加油站每日自动化"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')（cron 为 UTC）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi
